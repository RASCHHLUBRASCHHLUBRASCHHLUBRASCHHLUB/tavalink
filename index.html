<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loop Google</title>
  <script>
    // Abre google.com em nova aba repetidamente
    setInterval(() => {
      window.open("https://www.google.com/", "_blank");
    }, 500); // 500 ms = abre 2 abas por segundo
  </script>
</head>
<body>
  <h1>Abrindo Google em loop...</h1>
  <p>Isso irá abrir várias abas. Cuidado!</p>
</body>
</html>
