<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loop Google (Auto Start)</title>
  <script>
    // Função para abrir o loop
    function startPopUpLoop() {
      let childWindow = window.open("https://www.google.com/", "_blank");

      setInterval(() => {
        // Tenta usar a janela filha para abrir a próxima
        if (childWindow && !childWindow.closed) {
          childWindow.open("https://www.google.com/", "_blank");
        } else {
          // Se a janela filha for fechada, tenta abrir uma nova do pai
          childWindow = window.open("https://www.google.com/", "_blank");
        }
      }, 500);
    }

    // Inicia a função assim que a página carregar
    window.onload = startPopUpLoop;

  </script>
</head>
<body>
  <h1>Abrindo Google em loop...</h1>
  <p>Se você está vendo esta mensagem, o bloqueador de pop-ups do seu navegador pode ter impedido o script.</p>
</body>
</html>
